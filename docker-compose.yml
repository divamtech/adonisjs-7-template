version: '3.1'
services:
  redis:
    image: redis:6-alpine
    platform: linux/amd64
    restart: unless-stopped
    container_name: redis
    ports:
      - '6379:6379'

  postgres:
    image: postgres:18
    container_name: postgres
    restart: always
    platform: linux/amd64
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: root
    command: >
      bash -c "
        if [ ! -f /usr/share/postgresql/18/extension/vector.control ]; then
          echo 'pgvector not found. Installing postgresql-18-pgvector...'
          apt-get update && apt-get install -y postgresql-18-pgvector
        fi
        exec docker-entrypoint.sh postgres
      "

  # postgres:
  #   image: postgres:18
  #   container_name: postgres
  #   restart: always
  #   platform: linux/amd64
  #   ports:
  #     - '5432:5432'
  #   environment:
  #     POSTGRES_PASSWORD: root

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: "no"
    ports:
      - '54321:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: default@example.com
      PGADMIN_DEFAULT_PASSWORD: qwerty

